<style>

*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#fff7ed,#fff1d6);color:var(--ink)}

.hidden{display:none}.topline{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.score{font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(130px,100%),1fr));gap:12px;margin-top:18px}
.tile,.word,.choice{border:2px solid #eee;background:#fff;border-radius:16px;padding:15px;text-align:center;cursor:pointer;min-height:72px}
.tile{font-size:38px}.tile small{display:block;font-size:13px;color:var(--muted)}.selected{border-color:var(--accent);background:#fff4e6}.matched{border-color:var(--ok);background:#e9fbf7;opacity:.7}
.choice{font-size:17px}.choice.correct{border-color:var(--ok);background:#e9fbf7}.choice.wrong{border-color:var(--bad);background:#fff0f0}
.big{font-size:clamp(22px,4vw,34px);font-weight:800;text-align:center;margin:22px 0}.sentence{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px 0}.chip{padding:12px 16px;border-radius:12px;background:#f5f5f5;cursor:pointer;font-weight:700}
.answer{min-height:55px;border:2px dashed #ccc;border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px}.feedback{text-align:center;font-weight:800;min-height:28px;margin:15px 0}
.progress{height:10px;background:#eee;border-radius:10px;overflow:hidden}.bar{height:100%;background:var(--accent);width:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}.tile,.word,.choice,.chip{overflow-wrap:anywhere}.chip:disabled{cursor:default}.puzzle-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}
input{width:100%;padding:13px;border:2px solid #ddd;border-radius:12px;font-size:17px}.footer{text-align:center;color:var(--muted);padding:20px}

.story-text{font-size:18px;line-height:1.75;max-width:750px;margin:18px auto}.story-text p{margin:0 0 14px}.activity-controls{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.media-status{color:var(--muted);font-size:14px;min-height:22px}.story-options{display:grid;gap:12px}.story-options .choice{text-align:left;line-height:1.5;width:100%}.question-number{color:var(--muted);font-weight:700}.story-heading{font-size:25px;margin:20px 0 12px}.cinema-stage{overflow:hidden;position:relative;border-radius:18px;min-height:180px;background:linear-gradient(#c8e9ff 65%,#d5ebbc 65%);display:flex;justify-content:center;align-items:flex-end;gap:24px;padding:25px}.scene-place{position:absolute;font-size:75px;left:50%;top:10px;transform:translateX(-50%);opacity:.65}.actor{font-size:65px;z-index:1;animation:actor-enter .6s ease-out both}.actor:nth-child(3){animation-delay:.12s}.actor.speaking{animation:actor-talk 1.4s ease-in-out infinite}.scene-caption{font-size:18px;line-height:1.7;border:2px solid #ffba08;border-radius:16px;background:#fffdf3;padding:18px;margin-top:14px}.reading-tip{background:#fff4e6;border-radius:12px;padding:12px;line-height:1.6}button:disabled{opacity:.55;transform:none;cursor:default}@keyframes actor-enter{from{transform:translateY(80px);opacity:0}to{transform:translateY(0);opacity:1}}@keyframes actor-talk{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-7px)}}@media(prefers-reduced-motion:reduce){.actor,.actor.speaking{animation:none}}@media(max-width:400px){.wrap{padding:14px}.panel{padding:15px}.actor{font-size:52px}.story-text,.scene-caption{font-size:17px}}
.film-frame{display:block;border:0;border-radius:18px;width:100%;height:820px;background:#173638}@media(max-width:600px){.film-frame{height:690px}}
</style>
<style>.bonus-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}.bonus-option{color:white;min-height:85px;font-size:19px;overflow-wrap:anywhere}.bonus-color-0{background:#b91c1c}.bonus-color-1{background:#1d4ed8}.bonus-color-2{background:#856000}.bonus-color-3{background:#157039}.bonus-option:disabled{opacity:.8;cursor:default}.bonus-right{outline:5px solid #15803d;outline-offset:2px}.bonus-wrong{text-decoration:line-through}@media(max-width:520px){.bonus-grid{grid-template-columns:1fr}}</style></head>
<body>
<header><h1>🇬🇧 English – Game Zone</h1><div class="sub">Learn through play · Wortschatz, Grammatik und Sprachgefühl</div></header>
<div class="wrap">
<h2>1. Schwierigkeitsgrad</h2>
<div class="levels">
<button class="lvl active" data-l="1">🌱 Stufe 1<br><small>Grundlagen</small></button>
<button class="lvl" data-l="2">🚀 Stufe 2<br><small>Aufbau</small></button>
<button class="lvl" data-l="3">🧠 Stufe 3<br><small>Fortgeschritten</small></button>
<button class="lvl" data-l="4">🏆 Stufe 4<br><small>Challenge</small></button>
</div>
<h2>2. Wähle ein Spiel</h2>
<div class="games">
<button class="game" onclick="start('quizplus')"><b>🎯 Quiz-Festival · Neu</b>Bunte Antworten, Erklärungen und Punkte – ohne Timer.</button>
<button class="game" onclick="start('audioplus')"><b>🔊 Hörquiz · Neu</b>Kurze Hörtexte, beliebig oft anhören.</button>
<button class="game" onclick="start('reviewplus')"><b>🔁 Mein Lerntraining · Neu</b>Fehler aus Quiz und Hörquiz gezielt wiederholen.</button>
<button class="game" onclick="start('match')"><b>🖼️ Bild & Wort</b>Finde die passenden Paare.</button>
<button class="game" onclick="start('odd')"><b>🕵️ Eindringling</b>Welches Wort passt nicht?</button>
<button class="game" onclick="start('puzzle')"><b>🧩 Satz-Puzzle</b>Baue den Satz richtig zusammen.</button>
<button class="game" onclick="start('detective')"><b>🔎 Fehlerdetektiv</b>Finde die richtige Form.</button>
<button class="game" onclick="start('guess')"><b>❓ Who am I?</b>Errate das Wort aus Hinweisen.</button>
<button class="game" onclick="start('reading')"><b>📖 Stories</b>Lies eine Geschichte und löse drei Fragen.</button>
<button class="game" onclick="start('summary')"><b>📝 Summary</b>Welche Zusammenfassung stimmt?</button>
<button class="game" onclick="start('listening')"><b>🎧 Listen</b>Höre eine Geschichte und beantworte Fragen.</button>
<button class="game" onclick="start('cinema')"><b>🎬 Mini-Geschichte</b>Verschiedene Trickfilme mit Dialogen und Fragen.</button>
<button class="game" onclick="start('mission')"><b>💬 Your mission</b>Was sagst du in dieser Situation?</button>
<button class="game" onclick="surprise()"><b>🎲 Überrasch mich!</b>Ein zufälliges Spiel wartet auf dich.</button>
</div>
<div id="panel" class="panel hidden">
<div class="topline"><button onclick="home()">← Spiele</button><div class="score">⭐ Punkte: <span id="score">0</span></div></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div id="content"></div><div id="fb" class="feedback" role="status" aria-live="polite"></div>
</div>
</div><div class="footer">Let’s go! Fehler gehören zum Lernen. 💪</div>
<script>
let level=1,score=0,round=0,game='',selected=null,answer=[];
document.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>{document.querySelectorAll('.lvl').forEach(x=>x.classList.remove('active'));b.classList.add('active');level=+b.dataset.l;if(game)start(game)});
const vocab=[[{"e": "🏠", "w": "the house"}, {"e": "🚗", "w": "the car"}, {"e": "⚽", "w": "the ball"}, {"e": "👨", "w": "the man"}, {"e": "🐶", "w": "the dog"}, {"e": "🍎", "w": "the apple"}, {"e": "🐱", "w": "the cat"}, {"e": "🐴", "w": "the horse"}, {"e": "🐟", "w": "the fish"}, {"e": "🐦", "w": "the bird"}, {"e": "🌳", "w": "the tree"}, {"e": "🌸", "w": "the flower"}, {"e": "☀️", "w": "the sun"}, {"e": "🌙", "w": "the moon"}, {"e": "⭐", "w": "the star"}, {"e": "🍌", "w": "the banana"}, {"e": "🍐", "w": "the pear"}, {"e": "🍞", "w": "the bread"}, {"e": "🧀", "w": "the cheese"}, {"e": "🥛", "w": "the milk"}, {"e": "👟", "w": "the shoe"}, {"e": "👕", "w": "the T-shirt"}, {"e": "📖", "w": "the book"}, {"e": "✏️", "w": "the pencil"}], [{"e": "✈️", "w": "the plane"}, {"e": "🏫", "w": "the school"}, {"e": "🍽️", "w": "the plate"}, {"e": "🌧️", "w": "the rain"}, {"e": "📚", "w": "the books"}, {"e": "🚲", "w": "the bicycle"}, {"e": "🚂", "w": "the train"}, {"e": "🚢", "w": "the ship"}, {"e": "🚌", "w": "the bus"}, {"e": "🏥", "w": "the hospital"}, {"e": "🏖️", "w": "the beach"}, {"e": "⛰️", "w": "the mountain"}, {"e": "🌉", "w": "the bridge"}, {"e": "🧳", "w": "the suitcase"}, {"e": "☂️", "w": "the umbrella"}, {"e": "🔑", "w": "the key"}, {"e": "⌚", "w": "the watch"}, {"e": "📱", "w": "the phone"}, {"e": "💻", "w": "the computer"}, {"e": "🪑", "w": "the chair"}, {"e": "🛏️", "w": "the bed"}, {"e": "🪟", "w": "the window"}, {"e": "🚪", "w": "the door"}, {"e": "🧊", "w": "the ice"}], [{"e": "🚲➡️🏫", "w": "cycle to school"}, {"e": "📖👀", "w": "read a book"}, {"e": "🎧🎵", "w": "listen to music"}, {"e": "🍳🥘", "w": "prepare a meal"}, {"e": "🛒🍎", "w": "buy fruit"}, {"e": "🧹🏠", "w": "clean the house"}, {"e": "🐕🚶", "w": "walk the dog"}, {"e": "🏊💧", "w": "swim in the pool"}, {"e": "⚽🥅", "w": "play football"}, {"e": "✍️✉️", "w": "write a letter"}, {"e": "📞👵", "w": "call your grandmother"}, {"e": "🪥🦷", "w": "brush your teeth"}, {"e": "🧼👐", "w": "wash your hands"}, {"e": "🌱💧", "w": "water a plant"}, {"e": "📸🌄", "w": "take a photo"}, {"e": "🎸🎵", "w": "play the guitar"}, {"e": "💃🎵", "w": "dance"}, {"e": "🛏️😴", "w": "sleep"}, {"e": "🏃🌳", "w": "run in the park"}, {"e": "🚗🛣️", "w": "drive a car"}, {"e": "🚂🧳", "w": "travel by train"}, {"e": "🥾⛰️", "w": "walk in the mountains"}, {"e": "🍽️🧽", "w": "wash the dishes"}, {"e": "🎂🎉", "w": "celebrate a birthday"}], [{"e": "🚫📱🚗", "w": "do not use your phone while driving"}, {"e": "♻️🗑️", "w": "sort the rubbish"}, {"e": "🚰🚫", "w": "turn off the tap"}, {"e": "💡🚫", "w": "turn off the light"}, {"e": "🌳🌱", "w": "plant a tree"}, {"e": "🩹🦵", "w": "treat a wound"}, {"e": "🩼🚶", "w": "walk with crutches"}, {"e": "🧑‍🚒🔥", "w": "put out a fire"}, {"e": "🧑‍⚕️🩺", "w": "examine a patient"}, {"e": "🧑‍🏫📝", "w": "mark an exam"}, {"e": "🧑‍🍳🔪🥕", "w": "cut the vegetables"}, {"e": "🧵🪡👕", "w": "sew a T-shirt"}, {"e": "🔨🪑", "w": "repair a chair"}, {"e": "🎁📦", "w": "wrap a present"}, {"e": "⚖️🍎", "w": "weigh the fruit"}, {"e": "🌡️🤒", "w": "take your temperature"}, {"e": "🔭🌙", "w": "observe the moon"}, {"e": "🔬🧪", "w": "do an experiment"}, {"e": "🤝📝", "w": "sign an agreement"}, {"e": "💳🛒", "w": "pay by card"}, {"e": "🛂🧳", "w": "show your passport"}, {"e": "🗺️🧭", "w": "find your way with a map"}, {"e": "🧗⛰️", "w": "climb a mountain"}, {"e": "🤿🐠", "w": "dive in the sea"}]];
const pictureDecks=[[],[],[],[]];
const previousPictures=[[],[],[],[]];
function shuffled(values){const result=[...values];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}return result}
function nextPictures(){const index=level-1;if(pictureDecks[index].length<6){const previous=new Set(previousPictures[index]);const fresh=shuffled(vocab[index].filter(x=>!previous.has(x.w)));const recent=shuffled(vocab[index].filter(x=>previous.has(x.w)));pictureDecks[index]=fresh.concat(recent)}const items=pictureDecks[index].splice(0,6);previousPictures[index]=items.map(x=>x.w);return shuffled(items)}
const odds=[[["dog", "cat", "horse", "table"], ["Monday", "Tuesday", "Thursday", "shoe"]], [["eat", "drink", "sleep", "blue"], ["January", "April", "June", "Sunday"]], [["spoke", "ate", "went", "was living"], ["always", "never", "yesterday", "chair"]], [["although", "however", "therefore", "fork"], ["had seen", "had taken", "had gone", "will go"]]];
const puzzles=[["I live in London.", "I live in London ."], ["My sister has a dog.", "My sister has a dog ."], ["Yesterday we went to the cinema.", "Yesterday we went to the cinema ."], ["What are you going to do tomorrow?", "What are you going to do tomorrow ?"], ["When I was little, I played football.", "When I was little , I played football ."], ["I did not buy it because it was too expensive.", "I did not buy it because it was too expensive ."], ["If I had more time, I would learn Italian.", "If I had more time , I would learn Italian ."], ["Although it had rained, we would have gone out.", "Although it had rained , we would have gone out ."]];
const detective=[[["I am twelve years old.", "I have twelve years old."], ["She likes apples.", "She like apples."]], [["We went to the park yesterday.", "We goed to the park yesterday."], ["I have eaten breakfast.", "I have ate breakfast."]], [["While I was reading, the phone rang.", "While I were reading, the phone rang."], ["She gave it to me.", "She gave it to I."]], [["If I had known, I would have stayed at home.", "If I had knew, I would have stayed at home."], ["I look forward to seeing you.", "I look forward to see you."]]];
const guesses=[[{"h": "I am your home. I have rooms and a door. My name has five letters and begins with h.", "a": "house"}, {"h": "I have four wheels. You drive me on the road and I carry people.", "a": "car", "accept": ["automobile"]}], [{"h": "I am a person. I teach students at school.", "a": "teacher"}, {"h": "You open me above your head when it rains. My name begins with u.", "a": "umbrella"}], [{"h": "I am not yesterday or tomorrow. I am...", "a": "today"}, {"h": "In a match, I am the opposite of lose.", "a": "win"}], [{"h": "I mean to suddenly understand something. My name starts with r.", "a": "realise", "accept": ["realize"]}, {"h": "I mean to reach a goal through effort. My name starts with a.", "a": "achieve"}]];
let advancing=false, pendingTimer=null, puzzleWords=[], currentPuzzle=null, currentGuess=null;
function cancelAdvance(){stopMedia();if(pendingTimer!==null)clearTimeout(pendingTimer);pendingTimer=null;advancing=false}
function scheduleNext(delay){pendingTimer=setTimeout(()=>{pendingTimer=null;round++;next()},delay)}
function start(g){cancelAdvance();game=g;score=0;round=0;document.getElementById('panel').classList.remove('hidden');document.querySelector('.games').style.display='none';document.getElementById('score').textContent=score;next()}
function surprise(){start(shuffled(['match','odd','puzzle','detective','guess','reading','summary','listening','cinema','mission'])[0])}
function home(){cancelAdvance();game='';selected=null;document.getElementById('panel').classList.add('hidden');document.querySelector('.games').style.display='grid'}
function fb(t,ok){let f=document.getElementById('fb');f.textContent=t;f.style.color=ok?'var(--ok)':'var(--bad)'}
function clearChoices(){document.querySelectorAll('.choice').forEach(x=>x.classList.remove('wrong','correct'))}
function win(){if(advancing)return;advancing=true;score+=10;document.getElementById('score').textContent=score;fb('Well done! +10 ⭐',true);scheduleNext(1000)}
function next(){cancelAdvance();document.getElementById('bar').style.width=((round%5)/5*100)+'%';fb('',true);const games={match,odd,puzzle,detective:detect,guess,reading:()=>storyActivity('reading'),summary:()=>storyActivity('summary'),listening:()=>storyActivity('listening'),cinema:()=>storyActivity('cinema'),mission};if(games[game])games[game]()}
function button(text,cls,action){const b=document.createElement('button');b.type='button';b.className=cls;b.textContent=text;b.onclick=()=>action(b);return b}
function match(){let items=nextPictures();document.getElementById('content').innerHTML='<div class="big">Verbinde Bild und englisches Wort</div><div id="pictures" class="grid"></div><div id="words" class="grid"></div>';items.forEach(x=>{const b=button(x.e,'tile',pickImg);b.dataset.w=x.w;b.setAttribute('aria-label','Bild '+(document.getElementById('pictures').children.length+1));document.getElementById('pictures').appendChild(b)});shuffled(items).forEach(x=>{const b=button(x.w,'word',pickWord);b.dataset.w=x.w;document.getElementById('words').appendChild(b)});selected=null}
function pickImg(e){if(advancing||e.classList.contains('matched'))return;document.querySelectorAll('.tile').forEach(x=>x.classList.remove('selected'));e.classList.add('selected');selected=e;fb('Wähle das passende englische Wort.',true)}
function pickWord(e){if(advancing||e.classList.contains('matched'))return;if(!selected)return fb('Wähle zuerst ein Bild.',false);if(e.dataset.w===selected.dataset.w){e.classList.add('matched');selected.classList.remove('selected');selected.classList.add('matched');e.disabled=true;selected.disabled=true;score+=3;document.getElementById('score').textContent=score;fb('Correct!',true);selected=null;if(document.querySelectorAll('.word:not(.matched)').length===0){advancing=true;scheduleNext(1000)}}else fb('Noch nicht – wähle ein anderes Wort oder Bild.',false)}
function odd(){let q=odds[level-1][round%odds[level-1].length],correct=q[q.length-1];document.getElementById('content').innerHTML='<div class="big">🕵️ Welches Wort passt nicht?</div><div class="grid" id="choices"></div>';shuffled(q).forEach(x=>document.getElementById('choices').appendChild(button(x,'choice',el=>chooseOdd(el,x,correct))))}
function chooseOdd(el,x,a){if(advancing)return;clearChoices();if(x===a){el.classList.add('correct');win()}else{el.classList.add('wrong');fb('Das gehört zur Gruppe. Versuch es noch einmal.',false)}}
function puzzle(){currentPuzzle=puzzles[(level-1)*2+round%2];puzzleWords=shuffled(currentPuzzle[1].split(' '));answer=[];document.getElementById('content').innerHTML='<div class="big">🧩 Baue den englischen Satz</div><p>Tippe auf ein Wort im Satz, um es zurückzulegen.</p><div id="ans" class="answer"></div><div id="wordBank" class="sentence"></div><div class="puzzle-actions" id="puzzleActions"></div>';document.getElementById('puzzleActions').appendChild(button('Prüfen','primary',()=>checkPuzzle()));document.getElementById('puzzleActions').appendChild(button('Neu beginnen','',resetPuzzle));renderPuzzle()}
function renderPuzzle(){const bank=document.getElementById('wordBank'),ans=document.getElementById('ans');bank.replaceChildren();ans.replaceChildren();puzzleWords.forEach((w,i)=>{if(!answer.includes(i))bank.appendChild(button(w,'chip',()=>addWord(i)))});answer.forEach((i,pos)=>ans.appendChild(button(puzzleWords[i],'chip',()=>removeWord(pos))))}
function addWord(i){if(advancing||answer.includes(i))return;answer.push(i);fb('',true);renderPuzzle()}
function removeWord(pos){if(advancing)return;answer.splice(pos,1);fb('',true);renderPuzzle()}
function resetPuzzle(){if(advancing)return;answer=[];fb('',true);renderPuzzle()}
function sentence(words){return words.join(' ').replace(/\s+([.,?!])/g,'$1').replace(/([¿¡])\s+/g,'$1')}
const puzzleAlternatives=[["I live in London."], ["My sister has a dog."], ["Yesterday we went to the cinema.", "We went to the cinema yesterday.", "We went yesterday to the cinema."], ["What are you going to do tomorrow?"], ["When I was little, I played football."], ["I did not buy it because it was too expensive."], ["If I had more time, I would learn Italian."], ["Although it had rained, we would have gone out."]];
function checkPuzzle(){if(advancing)return;if(answer.length!==puzzleWords.length)return fb('Verwende zuerst alle Wörter und Satzzeichen.',false);const actual=sentence(answer.map(i=>puzzleWords[i]));const alternatives=puzzleAlternatives[puzzles.indexOf(currentPuzzle)];if(alternatives.some(x=>x.toLocaleLowerCase('en')===actual.toLocaleLowerCase('en')))win();else fb('Die Reihenfolge stimmt noch nicht. Tippe Wörter an, um sie zu ändern.',false)}
function detect(){let pair=detective[level-1][round%detective[level-1].length];document.getElementById('content').innerHTML='<div class="big">🔎 Welcher Satz ist korrekt?</div><div class="grid" id="choices"></div>';shuffled(pair).forEach(x=>document.getElementById('choices').appendChild(button(x,'choice',el=>checkDetect(el,x,pair[0]))))}
function checkDetect(el,x,a){if(advancing)return;clearChoices();if(x===a){el.classList.add('correct');win()}else{el.classList.add('wrong');fb('Da steckt ein Fehler drin. Versuch es noch einmal.',false)}}
function guess(){currentGuess=guesses[level-1][round%guesses[level-1].length];document.getElementById('content').innerHTML='<div class="big">❓ Who or what am I?</div><p id="hint" style="text-align:center;font-size:20px"></p><label for="guessInput">Deine englische Antwort:</label><input id="guessInput" placeholder="Type the word..." autocomplete="off"><p id="guessAction" style="text-align:center"></p>';document.getElementById('hint').textContent=currentGuess.h;document.getElementById('guessInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();checkGuess()}};document.getElementById('guessAction').appendChild(button('Antwort prüfen','primary',checkGuess))}
function normalizeGuess(value){return value.normalize('NFC').trim().toLocaleLowerCase('en').replace(/\s+/g,' ').replace(/^(the|a|an) /,'').replace(/[.!?]+$/,'')}
function checkGuess(){if(advancing)return;const v=normalizeGuess(document.getElementById('guessInput').value);if(!v)return fb('Gib zuerst eine Antwort ein.',false);if([currentGuess.a,...(currentGuess.accept||[])].some(x=>normalizeGuess(x)===v))win();else fb('Noch nicht. Denk an die Hinweise und versuch es erneut.',false)}

const stories=[[{"title": "The wrong school bag", "scenes": ["Lucy is twelve and goes to school by bus. Her bag is blue. Today she has a book, an apple and a sandwich in it.", "In class, she opens the bag. There are football boots and a T-shirt inside! This is not her bag.", "Her friend Daniel has a blue bag too. Lucy talks to him after class. Daniel looks in his bag and finds her sandwich.", "They swap bags and laugh. Then Lucy puts a yellow ribbon on her bag. Now she can recognise it easily."], "q": [["How does Lucy go to school?", ["By bus", "By bicycle", "On foot"], 0], ["What is in the wrong bag?", ["A cat", "Football boots and a T-shirt", "A yellow ribbon"], 1], ["Why does Lucy put a ribbon on her bag?", ["To recognise it more easily", "To give it away", "To carry more books"], 0]], "summaries": ["Lucy and Daniel mix up their blue bags. They swap them back, and Lucy adds a ribbon to recognise hers.", "Lucy loses her bag on the bus and buys a new yellow bag.", "Daniel gives Lucy his boots because she wants to play football."], "place": "🏫", "actors": ["👧", "👦"]}, {"title": "An indoor picnic", "scenes": ["It is Saturday. Ben wants to have lunch in the park with his mother. They prepare bread, cheese, tomatoes and two bottles of water.", "Before they leave, Ben looks out of the window. It is raining heavily. His mother says, “We cannot have lunch in the park today.”", "Ben has an idea. He puts a blanket on the living room floor. His mother brings the food and opens the basket.", "They eat together and listen to music. They are not in the park, but their picnic is fun. Afterwards, they play cards."], "q": [["What is the weather like?", ["It is sunny", "It is snowing", "It is raining heavily"], 2], ["Where do they have their picnic?", ["In the living room", "At school", "In a restaurant"], 0], ["What do they do after lunch?", ["Go to the park", "Play cards", "Prepare another basket"], 1]], "summaries": ["Ben and his mother have a picnic in the living room because it is raining. Afterwards, they play cards.", "Ben goes to the park alone and waits for his mother in the rain.", "Ben and his mother eat in a restaurant because there is no food at home."], "place": "🏡", "actors": ["👦", "👩"]}], [{"title": "A flat battery", "scenes": ["On Friday, Sarah arranged to meet her cousin Matt outside the museum at four. Before leaving home, she used her phone to find a shop and listen to music. She did not check the battery.", "When she reached the city centre, her phone switched off. She could not look at the map or call Matt. At first, she felt nervous, but she remembered the name of the museum.", "She went into a bakery and asked for directions. The shop assistant told her to go straight ahead and turn right after the library. Sarah followed the directions.", "She arrived ten minutes late. Matt was waiting for her. They visited the museum and then had hot chocolate. Sarah decided to carry a small paper map next time."], "q": [["Why can Sarah not call Matt?", ["She has lost his number", "Her phone battery is flat", "The museum is closed"], 1], ["Who gives her directions?", ["Matt", "A shop assistant in a bakery", "A driver"], 1], ["How does the afternoon end?", ["They visit the museum together", "Sarah goes home without seeing Matt", "Matt buys a phone"], 0]], "summaries": ["Sarah’s phone runs out of battery. She asks for directions in a bakery and arrives a little late at the museum, where Matt is waiting.", "Sarah loses her phone in the museum, and Matt goes home without her.", "A shop assistant charges Sarah’s phone and drives her to the museum."], "place": "🏙️", "actors": ["👩", "👨"]}, {"title": "The borrowed bicycle", "scenes": ["On Sunday, Emma wanted to go to the local market. Her bicycle had a flat tyre, so her neighbour Bruno lent her his. He asked her to bring it back before six.", "Emma bought oranges and bread. Then she went through the park and saw a friend. They talked for a while and lost track of time.", "At half past five, Emma checked her watch. She left immediately, but on the way home she found that a street was closed. She had to take a longer route.", "She arrived at five to six. Bruno was still at home. Emma returned the bicycle and gave him two oranges to thank him. She decided to repair her own tyre on Monday."], "q": [["Why does Emma borrow a bicycle?", ["Her own bicycle has a flat tyre", "She wants to sell hers", "She cannot walk"], 0], ["What delays her after she leaves the park?", ["A closed street", "An exam", "A storm"], 0], ["Does she return the bicycle on time?", ["No, she arrives the next day", "Yes, five minutes before six", "No, she arrives at seven"], 1]], "summaries": ["Emma borrows Bruno’s bicycle to visit the market. Despite chatting to a friend and taking a longer route, she returns it on time.", "Emma breaks Bruno’s bicycle and buys another one at the market.", "Bruno goes to the park with Emma, and both arrive home late."], "place": "🌳", "actors": ["👧", "👦"]}], [{"title": "The rooftop garden", "scenes": ["There was a roof terrace in Julia’s building that hardly anyone used. She suggested turning part of it into a small garden. Some neighbours liked the idea, but others worried that it would be expensive or cause problems with water.", "Before buying anything, Julia organised a meeting. A neighbour who worked as a technician explained that they first needed to check how much weight the roof could support. They also agreed to request permission and start with a few pots.", "Once they had permission and the safety checks were complete, they planted lettuce and herbs. They made a list to share the watering. During the holidays, however, two people forgot to tell the others that they would be away.", "Several plants dried out. Instead of abandoning the garden, the neighbours changed their system: each watering shift would have one person in charge and one backup. Julia learnt that a good idea needs clear agreements to work."], "q": [["What do they do before planting?", ["Buy a field", "Check the roof and request permission", "Invite a cook"], 1], ["Why do some plants dry out?", ["Nobody knows what they planted", "The watering arrangements fail during the holidays", "It rains too much"], 1], ["What is the main lesson?", ["Good organisation is also necessary", "Gardens always fail", "It is best not to talk to neighbours"], 0]], "summaries": ["The neighbours create a garden after checking the roof and getting permission. A watering problem leads them to improve their system.", "Julia plants without consulting anyone, and the roof has to be closed because of the weight.", "The neighbours abandon the garden because every plant dies and water is too expensive."], "place": "🌱", "actors": ["👩", "👨"]}, {"title": "The missed message", "scenes": ["Nora and Alex were preparing a play for the school celebration. Their group had been rehearsing for three weeks. On Wednesday, their teacher moved Thursday’s rehearsal to Friday because the school hall was unavailable.", "Alex posted the change in the group chat. Nora missed the message because she had silenced her notifications while studying. On Thursday, she arrived at school with her costume and found the hall door locked.", "At first, she thought that her classmates had excluded her. She wrote an angry message, but before sending it she called Alex. He explained what had happened and apologised for not checking that everyone knew about the change.", "On Friday, Nora joined the rehearsal. The group agreed to announce important changes both in the chat and in class. Nora was glad that she had asked before jumping to conclusions."], "q": [["Why is the rehearsal moved?", ["Nora does not want to join in", "The hall is unavailable", "Alex has lost his costume"], 1], ["What prevents a bigger argument?", ["Nora calls before sending her message", "Alex cancels the play", "The teacher closes the chat"], 0], ["What does the group agree to do?", ["Stop rehearsing", "Announce changes in class too", "Only send private messages"], 1]], "summaries": ["Nora misses a change of date and thinks she has been excluded. A phone call clears up the misunderstanding, and the group improves its communication.", "The classmates exclude Nora from the play, and she decides to leave the school.", "Nora moves the rehearsal to Thursday, and Alex complains that nobody called him."], "place": "🎭", "actors": ["👧", "👦"]}], [{"title": "A story too good to be true", "scenes": ["The school newspaper received a message promising free public transport for every young person in the city from the following month. It seemed ideal for the front page. However, the message did not link to an original announcement, and the photograph showed a bus from another city.", "Some reporters wanted to publish it immediately, but Elena suggested checking it first. She found a proposal from an association, but no approved decision. The document also mentioned student discounts rather than free journeys for all young people.", "The team called the city information service. A member of staff confirmed that a measure was being considered, although neither its conditions nor its starting date had been decided. Elena suggested a less dramatic headline that clearly distinguished a proposal from a final decision.", "They published an article about the debate, explaining what was confirmed and what remained uncertain. It attracted fewer views than they had hoped, but several readers thanked them for being clear. The team realised that accurate reporting sometimes means giving up a catchy headline."], "q": [["What does Elena discover?", ["There is a proposal but no approved decision", "Transport is already free", "The association has closed"], 0], ["What does the city information service confirm?", ["The exact starting date", "A measure is still being considered", "All buses will be replaced"], 1], ["What does the newspaper prioritise?", ["Getting views at any cost", "Hiding the missing information", "Separating confirmed facts from what is still uncertain"], 2]], "summaries": ["The team checks a story and finds that it exaggerates an unapproved proposal. They publish a careful article separating confirmed facts from unresolved details.", "Elena confirms that all young people will travel free next month, and the newspaper announces the date.", "The newspaper stops covering transport because readers dislike clear articles."], "place": "📰", "actors": ["👩", "👨"]}, {"title": "A library for everyone", "scenes": ["The local library wanted to attract more teenagers. Its director suggested turning a rarely used room into a space for projects, conversations and workshops. Some residents welcomed the idea, while others feared losing one of the few quiet places in the area.", "At the first meeting, their opinions seemed incompatible. Mark, a student preparing for his exams, defended the need for silence. Amina, who ran a reading club, argued that a library could also be a meeting place. Both agreed, however, that the space should remain accessible to everyone.", "The director proposed a six-week trial. Workshops would take place at specified times, and the study room would retain its usual purpose. Clear signs would be installed, and users would be invited to comment on the noise and attendance.", "At the end of the trial, there were complaints about one particularly noisy workshop. However, young people who had never visited the library before had also taken part. The staff adjusted the schedule and moved that activity elsewhere. Their solution did not remove every disagreement, but it allowed different uses without giving up quiet study."], "q": [["What do Mark and Amina agree on?", ["Closing the study room", "Keeping the space accessible to everyone", "Banning every workshop"], 1], ["What is the purpose of the six-week trial?", ["To evaluate the new activities and their effects", "To sell the library", "To replace all the books"], 0], ["What happens to the noisy workshop?", ["The complaints are ignored", "All projects are cancelled", "It is moved elsewhere, and the schedule is adjusted"], 2]], "summaries": ["The library trials new activities while keeping the study room. After gathering feedback, it adjusts the schedule and moves a noisy workshop elsewhere.", "The library replaces the study room with workshops and decides that exams no longer matter.", "Every resident rejects the trial, and the director cancels all activities before they begin."], "place": "📚", "actors": ["👩", "👨"]}]];

th groups have space.", "Other people have no right to study.", "It is best not to listen to anyone."], 0, "Du schlägst einen Kompromiss für beide Gruppen vor."]]];

let activeStory=null, activeMode='', questionIndex=0, sceneIndex=0, questionLocked=false, speechRun=0;
function stopMedia(){document.querySelectorAll("iframe.film-frame").forEach(f=>f.contentWindow?.postMessage("pause-film","*"));speechRun++;if(window.speechSynthesis)window.speechSynthesis.cancel();document.querySelectorAll('.actor').forEach(x=>x.classList.remove('speaking'))}
function mediaStatus(text){const el=document.getElementById('mediaStatus');if(el)el.textContent=text}
function speak(text){stopMedia();if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){mediaStatus('Die Sprachausgabe ist hier nicht verfügbar. Du kannst den Text einblenden und lesen.');return}const run=speechRun;const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=level===1?.65:level===2?.7:.75;const voices=window.speechSynthesis.getVoices();const voice=voices.find(v=>v.lang.toLowerCase().startsWith('en'));if(voice)u.voice=voice;u.onstart=()=>{if(run!==speechRun)return;mediaStatus('Die Geschichte wird vorgelesen.');document.querySelectorAll('.actor').forEach(x=>x.classList.add('speaking'))};u.onend=()=>{if(run!==speechRun)return;mediaStatus('Fertig. Du kannst noch einmal hören.');document.querySelectorAll('.actor').forEach(x=>x.classList.remove('speaking'))};u.onerror=()=>{if(run!==speechRun)return;mediaStatus('Die Stimme konnte nicht abgespielt werden. Bitte nutze den eingeblendeten Text.');document.querySelectorAll('.actor').forEach(x=>x.classList.remove('speaking'))};mediaStatus('Sprachausgabe wird gestartet …');try{window.speechSynthesis.speak(u)}catch(e){u.onerror()}}
function addControl(parent,label,action,cls=''){parent.appendChild(button(label,cls,action))}
function storyText(parent){const box=document.createElement('div');box.className='story-text';box.lang='en';activeStory.scenes.forEach(t=>{const paragraph=document.createElement('p');paragraph.textContent=t;box.appendChild(paragraph)});parent.appendChild(box);return box}
function storyActivity(mode){activeStory=stories[level-1][round%stories[level-1].length];activeMode=mode;questionIndex=0;questionLocked=false;sceneIndex=0;const root=document.getElementById('content');root.replaceChildren();const title=document.createElement('h3');title.className='story-heading';title.textContent=activeStory.title;title.lang='en';root.appendChild(title);
if(mode==='reading'||mode==='summary'){storyText(root)}
if(mode==='listening'){const tip=document.createElement('p');tip.className='reading-tip';tip.textContent='Höre zuerst die Geschichte. Die Stimme kommt von deinem Gerät; Qualität und Verfügbarkeit können variieren. Du kannst beliebig oft hören oder den Text als Hilfe einblenden.';root.appendChild(tip);const controls=document.createElement('div');controls.className='activity-controls';root.appendChild(controls);addControl(controls,'▶ Geschichte anhören',()=>speak(activeStory.scenes.join(' ')),'primary');addControl(controls,'■ Stoppen',()=>{stopMedia();mediaStatus('Wiedergabe gestoppt.')});const transcript=document.createElement('div');transcript.id='transcript';transcript.hidden=true;storyText(transcript);addControl(controls,'Text einblenden',b=>{transcript.hidden=!transcript.hidden;b.textContent=transcript.hidden?'Text einblenden':'Text ausblenden'});root.appendChild(transcript);const status=document.createElement('p');status.id='mediaStatus';status.className='media-status';status.setAttribute('role','status');root.appendChild(status)}
if(mode==='cinema'){const tip=document.createElement('p');tip.className='reading-tip';tip.textContent='Ein gezeichneter Trickfilm mit englischen Dialogen. Die Stimme hängt von deinem Gerät ab; Untertitel sind immer sichtbar. Danach kannst du die Fragen öffnen.';root.appendChild(tip);const frame=document.createElement('iframe');frame.className='film-frame';frame.title=activeStory.title+' – Trickfilm';frame.srcdoc=filmDocument(level,round%2);root.appendChild(frame);const controls=document.createElement('div');controls.className='activity-controls';root.appendChild(controls);addControl(controls,'Fragen zum Film öffnen',()=>{stopMedia();const questions=document.getElementById('storyQuestions');questions.hidden=false;if(!questions.children.length)renderQuestion();questions.scrollIntoView?.({behavior:'smooth',block:'start'})},'primary')}
const questions=document.createElement('div');questions.id='storyQuestions';root.appendChild(questions);if(mode==='cinema'){questions.hidden=true}else if(mode==='summary')renderSummary();else renderQuestion()}
function renderScene(){stopMedia();const parent=document.getElementById('scene');parent.replaceChildren();const count=document.createElement('p');count.className='question-number';count.textContent='Szene '+(sceneIndex+1)+' von '+activeStory.scenes.length;parent.appendChild(count);const stage=document.createElement('div');stage.className='cinema-stage';stage.setAttribute('aria-hidden','true');const place=document.createElement('div');place.className='scene-place';place.textContent=activeStory.place;stage.appendChild(place);activeStory.actors.forEach(a=>{const actor=document.createElement('div');actor.className='actor';actor.textContent=a;stage.appendChild(actor)});parent.appendChild(stage);const caption=document.createElement('p');caption.className='scene-caption';caption.lang='en';caption.textContent=activeStory.scenes[sceneIndex];parent.appendChild(caption);const controls=document.createElement('div');controls.className='activity-controls';parent.appendChild(controls);addControl(controls,'◀ Zurück',()=>{sceneIndex--;renderScene()});controls.lastChild.disabled=sceneIndex===0;addControl(controls,'▶ Szene anhören',()=>speak(activeStory.scenes[sceneIndex]));addControl(controls,'■ Stoppen',()=>{stopMedia();mediaStatus('Wiedergabe gestoppt.')});if(sceneIndex<activeStory.scenes.length-1)addControl(controls,'Nächste Szene →',()=>{sceneIndex++;renderScene()},'primary');else addControl(controls,'Zu den Fragen →',()=>{stopMedia();document.getElementById('storyQuestions').hidden=false;renderQuestion();document.getElementById('storyQuestions').scrollIntoView?.({behavior:'smooth',block:'start'})},'primary');const status=document.createElement('p');status.className='media-status';status.id='mediaStatus';status.setAttribute('role','status');parent.appendChild(status)}
function renderQuestion(){questionLocked=false;const root=document.getElementById('storyQuestions');root.replaceChildren();const count=document.createElement('p');count.className='question-number';count.textContent='Frage '+(questionIndex+1)+' von '+activeStory.q.length;root.appendChild(count);const q=activeStory.q[questionIndex];const title=document.createElement('h3');title.lang='en';title.textContent=q[0];root.appendChild(title);const options=document.createElement('div');options.className='story-options';root.appendChild(options);shuffled(q[1].map((text,index)=>({text,index}))).forEach(x=>{const b=button(x.text,'choice',el=>answerQuestion(el,x.index));b.lang='en';options.appendChild(b)})}
function answerQuestion(el,index){if(advancing||questionLocked)return;clearChoices();if(index!==activeStory.q[questionIndex][2]){el.classList.add('wrong');fb('Noch nicht. Prüfe die Geschichte und versuch es erneut.',false);return}el.classList.add('correct');questionLocked=true;if(questionIndex===activeStory.q.length-1){win();return}fb('Correct! Weiter zur nächsten Frage.',true);addControl(document.getElementById('storyQuestions'),'Nächste Frage →',()=>{if(advancing)return;questionIndex++;fb('',true);renderQuestion()},'primary')}
function renderSummary(){const root=document.getElementById('storyQuestions');const h=document.createElement('h3');h.textContent='Which summary is correct?';h.lang='en';root.appendChild(h);const options=document.createElement('div');options.className='story-options';root.appendChild(options);shuffled(activeStory.summaries.map((text,index)=>({text,index}))).forEach(x=>{const b=button(x.text,'choice',el=>{if(advancing)return;clearChoices();if(x.index===0){el.classList.add('correct');win()}else{el.classList.add('wrong');fb('Diese Zusammenfassung verändert wichtige Details. Lies noch einmal.',false)}});b.lang='en';options.appendChild(b)})}
function mission(){const task=missions[level-1][round%missions[level-1].length];document.getElementById('content').innerHTML='<h3 id="missionTitle" class="story-heading"></h3><p id="missionPrompt" class="scene-caption" lang="en"></p><div id="missionChoices" class="story-options"></div>';document.getElementById('missionTitle').textContent='💬 '+task[0];document.getElementById('missionPrompt').textContent=task[1];shuffled(task[2].map((text,index)=>({text,index}))).forEach(x=>{const b=button(x.text,'choice',el=>{if(advancing)return;clearChoices();if(x.index===task[3]){el.classList.add('correct');win();fb('Well done! '+task[4]+' +10 ⭐',true)}else{el.classList.add('wrong');fb('Passt das zur Situation? Versuch es noch einmal.',false)}});b.lang='en';document.getElementById('missionChoices').appendChild(b)})}


const filmTemplate="<!doctype html><html lang=\"de\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><style>\n*{box-sizing:border-box}body{margin:0;background:#17252b;color:#fff;font-family:system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:20px}h1{font-size:clamp(24px,5vw,40px);margin:12px 0 4px}.sub{color:#b9cdd0;margin:0 0 18px}.screen{position:relative;overflow:hidden;border-radius:20px;background:#f5dec2;box-shadow:0 20px 60px #0006}svg{display:block;width:100%;aspect-ratio:16/9}.caption{min-height:105px;padding:18px 22px;background:#07151e;color:#fff;font-size:clamp(17px,2.8vw,25px);line-height:1.45}.speaker{color:#ffc972;font-size:14px;font-weight:800;letter-spacing:.06em;display:block;margin-bottom:5px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}button{cursor:pointer;border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:750;background:#f5f0e5;color:#142831}button.primary{background:#ffca75}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:3px solid #68ddc1;outline-offset:3px}.track{height:6px;border-radius:8px;background:#344950;overflow:hidden}.fill{height:100%;background:#ffca75;width:0;transition:width .2s}#status{color:#b9cdd0;font-size:14px;min-height:24px}.note{font-size:14px;color:#b9cdd0;line-height:1.6}#camera{transition:transform 1.2s ease;transform-origin:480px 260px}.person{transition:transform 1.7s cubic-bezier(.2,.8,.3,1)}.mouth{transform-box:fill-box;transform-origin:center}.talking .mouth{animation:mouth .3s infinite alternate}.talking .head{animation:nod 1.2s ease-in-out infinite}.head{transform-box:fill-box;transform-origin:center bottom}.arm{transform-box:fill-box;transform-origin:top center;transition:transform .6s}.gesturing .arm{transform:rotate(-28deg)}.walking .body{animation:walk .28s infinite alternate}.walking .leg{animation:step .3s infinite alternate;transform-box:fill-box;transform-origin t.querySelector('.track').setAttribute('aria-valuenow',pct);$('status').textContent='Szene '+(index+1)+' von '+data.shots.length;const duration=Math.max(4500,s.text.split(/\\s+/).length*(data.level<3?490:430)+1600);schedule(duration);if(sound&&window.speechSynthesis&&window.SpeechSynthesisUtterance){const u=new SpeechSynthesisUtterance(s.text);u.lang='en-GB';u.rate=data.level===1?.78:data.level===2?.86:.94;const v=window.speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('en'));if(v)u.voice=v;u.onstart=()=>{if(local!==token||paused||!running)return;clearTimeout(timer);schedule(Math.max(60000,duration*2))};u.onend=()=>{if(local!==token||paused||!running)return;clearTimeout(timer);schedule(900)};u.onerror=()=>{if(local!==token)return;$('status').textContent='Stimme nicht verfügbar – der Film läuft mit Untertiteln.'};try{window.speechSynthesis.speak(u)}catch(e){u.onerror()}}else if(sound)$('status').textContent='Keine Sprachausgabe verfügbar – Untertitel bleiben sichtbar.'}\nfunction finish(){cancel();clearActors();running=false;$('titleCard').style.opacity=1;$('cardSub').textContent='THE END · Thanks for watching';$('speaker').textContent='THE END';$('line').textContent='Du kannst den Film erneut ansehen oder darunter die Fragen öffnen.';$('play').textContent='▶ Noch einmal';$('pause').disabled=true;$('status').textContent='Film beendet.'}\nfunction pause(){if(!running||paused)return;paused=true;cancel();$('screen').classList.add('paused');$('pause').textContent='▶ Fortsetzen';$('play').textContent='▶ Fortsetzen';$('status').textContent='Pause. Die aktuelle Szene beginnt beim Fortsetzen erneut.'}\nfunction resume(){if(!running||!paused)return;paused=false;$('screen').classList.remove('paused');$('pause').textContent='Ⅱ Pause';$('play').textContent='▶ Läuft';show()}\nfunction start(){setup();running=true;$('pause').disabled=false;$('play').textContent='▶ Läuft';advance()}\n$('play').onclick=()=>{if(paused)resume();else if(!running)start()};$('pause').o me!"}]}, {"title": "The rooftop garden", "level": 3, "theme": "garden", "icon": "🌱", "places": ["A suggestion", "Checks and permission", "A watering problem", "Better organisation"], "props": [["🌱", "💡"], ["📋", "✅"], ["🥀", "💧"], ["🌱", "📅"]], "shots": [{"who": "Narrator", "text": "There was a roof terrace in Julia’s building that hardly anyone used. She suggested turning part of it into a small garden. Some neighbours liked the idea, but others worried that it would be expensive or cause problems with water.", "actor": "", "scene": 0}, {"who": "Julia", "text": "What if we made a garden on the roof terrace?", "actor": "ana", "scene": 0, "bubble": "A garden"}, {"who": "Narrator", "text": "Before buying anything, Julia organised a meeting. A neighbour who worked as a technician explained that they first needed to check how much weight the roof could support. They also agreed to request permission and start with a few pots.", "actor": "", "scene": 1}, {"who": "Neighbour", "text": "First, we must check the weight and ask for permission.", "actor": "leo", "scene": 1, "bubble": "Check first"}, {"who": "Narrator", "text": "Once they had permission and the safety checks were complete, they planted lettuce and herbs. They made a list to share the watering. During the holidays, however, two people forgot to tell the others that they would be away.", "actor": "", "scene": 2}, {"who": "Julia", "text": "These plants need water. Some shifts have not been covered.", "actor": "ana", "scene": 2, "bubble": "No water"}, {"who": "Narrator", "text": "Several plants dried out. Instead of abandoning the garden, the neighbours changed their system: each watering shift would have one person in charge and one backup. Julia learnt that a good idea needs clear agreements to work.", "actor": "", "scene": 3}, {"who": "Neighbour", "text": "Each shift will have one person in charge and one backup.", "actor": "leo", "scene": 3, "bubble": "Work together"}]}, {"title": "The missed message", "level": 3, ️", "⏳"], ["📰", "✅"]], "shots": [{"who": "Narrator", "text": "The school newspaper received a message promising free public transport for every young person in the city from the following month. It seemed ideal for the front page. However, the message did not link to an original announcement, and the photograph showed a bus from another city.", "actor": "", "scene": 0}, {"who": "Elena", "text": "That photograph does not look like our city. We must check the story.", "actor": "ana", "scene": 0, "bubble": "Is it true?"}, {"who": "Narrator", "text": "Some reporters wanted to publish it immediately, but Elena suggested checking it first. She found a proposal from an association, but no approved decision. The document also mentioned student discounts rather than free journeys for all young people.", "actor": "", "scene": 1}, {"who": "Elena", "text": "I can only find a proposal for discounts, not a decision about free journeys.", "actor": "ana", "scene": 1, "bubble": "A proposal"}, {"who": "Narrator", "text": "The team called the city information service. A member of staff confirmed that a measure was being considered, although neither its conditions nor its starting date had been decided. Elena suggested a less dramatic headline that clearly distinguished a proposal from a final decision.", "actor": "", "scene": 2}, {"who": "Reporter", "text": "The city information service confirms that the measure is still being considered.", "actor": "leo", "scene": 2, "bubble": "No date yet"}, {"who": "Narrator", "text": "They published an article about the debate, explaining what was confirmed and what remained uncertain. It attracted fewer views than they had hoped, but several readers thanked them for being clear. The team realised that accurate reporting sometimes means giving up a catchy headline.", "actor": "", "scene": 3}, {"who": "Elena", "text": "Our article will separate confirmed facts from what remains uncertain.", "actor": "ana", "scene": 3, "bubble": "Check the facts"}]} g up quiet study.", "actor": "", "scene": 3}, {"who": "Director", "text": "We will adjust the schedule and move the noisy workshop elsewhere.", "actor": "ana", "scene": 3, "bubble": "A compromise"}]}];

function bonusSave(q,wrong){try{const ids=bonusLoad().map(rows=>rows.map(x=>x.id));const set=new Set(ids[level-1]);wrong?set.add(q.id):set.delete(q.id);ids[level-1]=[...set];localStorage.setItem('englishBonusReviewV1',JSON.stringify(ids));}catch{}}
function bonusRender(){const root=document.getElementById('content');root.replaceChildren();fb('',true);bonusLocked=false;document.getElementById('bar').style.width=(bonusDeck.length?bonusIndex/bonusDeck.length*100:0)+'%';if(bonusIndex>=bonusDeck.length){const title=document.createElement('h2');title.textContent=bonusDeck.length?'Well done!':'Noch keine Fehler für diese Stufe gespeichert.';root.append(title);const p=document.createElement('p');p.textContent=bonusDeck.length?`${bonusDeck.length} Aufgaben · ${score} Punkte. Fehler sind Lernchancen.`:'Spiele zuerst das Quiz oder Hörquiz. Falsche Antworten werden hier zum Üben gesammelt, soweit dein Browser das Speichern erlaubt.';root.append(p);if(bonusMistakes.length)root.append(button('Fehler dieser Runde wiederholen','primary',()=>{bonusDeck=shuffled(bonusMistakes);bonusMistakes=[];bonusIndex=0;next();}));root.append(button('Neue Runde','',()=>start(game)),button('Andere Spiele','',home));return;}const q=bonusDeck[bonusIndex];const status=document.createElement('p');status.textContent=`${game==='audioplus'?'🎧 Hörquiz':game==='reviewplus'?'🔁 Wiederholung':'🎯 Quiz'} · Aufgabe ${bonusIndex+1} / ${bonusDeck.length} · Ohne Zeitdruck`;const title=document.createElement('h2');title.textContent=q.prompt;root.append(status,title);if(q.audio){root.append(button('🔊 Langsam anhören','primary',()=>speak(q.audio)));const media=document.createElement('p');media.id='mediaStatus';media.setAttribute('role','status');root.append(media);const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='Hörtext anzeigen';const text=document.createElement('p');text.textContent=q.audio;details.append(summary,text);root.append(details);}const grid=document.createElement('div');grid.className='bonus-grid';shuffled(q.options).forEach((opt,i)=>{const b=button(['▲ ','◆ ','● ','■ '][i]+opt,'bonus-option bonus-color-'+i,()=>{if(bonusLocked)return;bonusLocked=true;stopMedia();const correct=opt===q.correct;bonusSave(q,!correct);if(!correct&&!bonusMistakes.some(x=>x.id===q.id))bonusMistakes.push(q);if(correct)score+=10;document.getElementById('score').textContent=score;for(const child of grid.children){child.disabled=true;if(child.dataset.answer===q.correct)child.classList.add('bonus-right');}if(!correct)b.classList.add('bonus-wrong');fb(correct?'Correct! +10 ⭐':'Richtige Antwort: '+q.correct,correct);const explanation=document.createElement('p');explanation.textContent=q.explanation;root.append(explanation,button('Weiter →','primary',()=>{bonusIndex++;next();}));});b.dataset.answer=opt;grid.append(b);});root.append(grid);}

</script>
